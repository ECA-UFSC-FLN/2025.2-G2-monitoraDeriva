services:
  api:
    build:
      context: ./api
    container_name: flask_api
    ports:
      - "5000:5000"
    networks:
      - app-network
    env_file:
      - .env

  dashboard:
    build:
      context: ./dashboard
    container_name: dash_dashboard
    ports:
      - "8050:8050"
    networks:
      - app-network
    depends_on:
      - api
    env_file:
      - .env

  postgres:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:

